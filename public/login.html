<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WetKit OS — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0f1a; color: #e2e8f0; font-family: monospace;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #111827; border: 1px solid #1f2937;
      border-radius: 12px; padding: 40px; width: 100%; max-width: 400px;
    }
    h1 { font-size: 22px; color: #3b82f6; margin-bottom: 4px; }
    .tag { font-size: 11px; color: #6b7280; margin-bottom: 32px; }
    .tabs { display: flex; gap: 0; margin-bottom: 24px; border: 1px solid #1f2937; border-radius: 6px; overflow: hidden; }
    .tab {
      flex: 1; padding: 8px; text-align: center; font-size: 12px;
      cursor: pointer; background: transparent; border: none; color: #6b7280;
      font-family: monospace;
    }
    .tab.active { background: #1d4ed8; color: white; }
    .field { margin-bottom: 16px; }
    .field label { font-size: 11px; color: #6b7280; display: block; margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 10px 12px;
      background: #0a0f1a; border: 1px solid #1f2937;
      border-radius: 6px; color: #e2e8f0; font-size: 13px; font-family: monospace;
    }
    .field input:focus { outline: none; border-color: #3b82f6; }
    .btn {
      width: 100%; padding: 12px; background: #1d4ed8; color: white;
      border: none; border-radius: 6px; font-size: 13px;
      font-family: monospace; cursor: pointer; margin-top: 8px;
    }
    .btn:hover { background: #2563eb; }
    .msg { font-size: 12px; margin-top: 12px; padding: 10px; border-radius: 6px; display: none; }
    .msg.error { background: #2d0a0a; border: 1px solid #dc2626; color: #fca5a5; }
    .msg.success { background: #052e16; border: 1px solid #16a34a; color: #86efac; }
    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>
<div class="card">
  <h1>WetKit OS</h1>
  <p class="tag">Single line. Full spool. Pre-fab ready.</p>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Sign in</button>
    <button class="tab" onclick="switchTab('register')">Register</button>
  </div>

  <div class="panel active" id="loginPanel">
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>PIN</label>
      <input type="password" id="loginPin" placeholder="Your PIN" maxlength="8">
    </div>
    <button class="btn" onclick="doLogin()">Sign in →</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div class="panel" id="registerPanel">
    <div class="field">
      <label>Full name</label>
      <input type="text" id="regName" placeholder="Akhil Ganatra">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="regEmail" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>PIN (4–8 digits)</label>
      <input type="password" id="regPin" placeholder="Choose a PIN" maxlength="8">
    </div>
    <button class="btn" onclick="doRegister()">Create account →</button>
    <div class="msg" id="regMsg"></div>
  </div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) =>
    t.classList.toggle('active', (i===0) === (tab==='login')));
  document.getElementById('loginPanel').classList.toggle('active', tab==='login');
  document.getElementById('registerPanel').classList.toggle('active', tab==='register');
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.style.display = 'block';
  el.className = `msg ${type}`;
  el.textContent = text;
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pin   = document.getElementById('loginPin').value.trim();
  if (!email || !pin) return showMsg('loginMsg', 'Email and PIN required', 'error');
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, pin })
    });
    const data = await r.json();
    if (!r.ok) return showMsg('loginMsg', data.error, 'error');
    localStorage.setItem('wk_token', data.token);
    localStorage.setItem('wk_project', data.projectId);
    localStorage.setItem('wk_name', data.name);
    localStorage.setItem('wk_tenant', data.tenantId);
    showMsg('loginMsg', `Welcome back, ${data.name}!`, 'success');
    setTimeout(() => window.location.href = '/', 800);
  } catch (e) {
    showMsg('loginMsg', 'Connection error', 'error');
  }
}

async function doRegister() {
  const name  = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pin   = document.getElementById('regPin').value.trim();
  if (!name || !email || !pin)
    return showMsg('regMsg', 'All fields required', 'error');
  if (pin.length < 4)
    return showMsg('regMsg', 'PIN must be at least 4 digits', 'error');
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, pin })
    });
    const data = await r.json();
    if (!r.ok) return showMsg('regMsg', data.error, 'error');
    localStorage.setItem('wk_token', data.token);
    localStorage.setItem('wk_project', data.projectId);
    localStorage.setItem('wk_name', data.name);
    localStorage.setItem('wk_tenant', data.tenantId);
    showMsg('regMsg', `Account created! Welcome, ${data.name}`, 'success');
    setTimeout(() => window.location.href = '/', 800);
  } catch (e) {
    showMsg('regMsg', 'Connection error', 'error');
  }
}
</script>
</body>
</html>
